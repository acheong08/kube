apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: invidious
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      nodeSelector:
        public: "true"
      containers:
      - name: caddy
        image: caddy:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: caddy-config-volume
          mountPath: /etc/caddy
      volumes:
      - name: caddy-config-volume
        configMap:
          name: caddy-config
          items:
          - key: Caddyfile
            path: Caddyfile
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: invidious
data:
  Caddyfile: |
    :80 {
        log {
          output stdout
          format json
        }
        route {
            header {
              -Content-Security-Policy
              Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; media-src 'self' blob: https://*.googlevideo.com:443 https://*.youtube.com:443; child-src 'self' blob:; frame-src 'self'; frame-ancestors 'none'"
            }
            @proxy-routes {
              expression `path_regexp('^/(vi/|vi_webp/|sb/|ggpht/|a/|ytc/)')`
            }
            @api-blocked {
                path /api/v1/*
                not expression `path_regexp('^/api/v1/(stats|comments|storyboard|annotations|auth)')`
            }

            handle @api-blocked {
                respond "API endpoint blocked" 403
            }

            handle @proxy-routes {
                header yt-proxy "true"
                reverse_proxy yt-proxy:8080
            }
            handle /companion/videoplayback {
                header yt "proxy"
                uri strip_prefix /companion
                reverse_proxy yt-proxy:8080
            }
            handle /companion/* {
                header companion "true"
                reverse_proxy invidious-companion:8282
            }
            handle /sabr/* {
                reverse_proxy sabr:80
            }
            @sabr_path {
                path /watch
                query v=*
            }
            #handle @sabr_path {
            #    reverse_proxy sabr:80
            #}
            #@watch-path-id path_regexp watch_id ^/watch/([a-zA-Z0-9_-]+)
            #handle @watch-path-id {
            #    rewrite /watch?v={re.watch_id.1}
            #    reverse_proxy invidious:3000
            #}
            handle /* {
                reverse_proxy invidious:3000
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: invidious
spec:
  type: ClusterIP
  selector:
    app: caddy
  ports:
    - port: 80
      targetPort: 80
