apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invidious-ingress-iv
  namespace: invidious
  labels:
    app: invidious
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    spec.ingressClassName: traefik
spec:
  rules:
    - host: iv.duti.dev
      http:
        paths:
          - path: /companion/videoplayback
            pathType: Exact
            backend:
              service:
                name: caddy
                port:
                  number: 80
          - path: /companion/latest_version
            pathType: Exact
            backend:
              service:
                name: anubis
                port:
                  number: 80
          - path: /fonts/
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
          - path: /companion/
            pathType: Prefix
            backend:
              service:
                name: invidious-companion
                port:
                  number: 8282
          - path: /proxy/
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: anubis
                port:
                  number: 80
  tls:
    - hosts:
        - iv.duti.dev
      secretName: invidious-tls
---
