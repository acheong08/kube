#   - "--entrypoints.web.http.middlewares=kube-system-bouncer@kubernetescrd"
#   - "--entrypoints.websecure.http.middlewares=kube-system-bouncer@kubernetescrd"
#   - "--entryPoints.websecure.http.tls=true"
#   - "--providers.kubernetescrd"
deployment:
  kind: DaemonSet
updateStrategy:
  rollingUpdate:
    maxUnavailable: 2
    maxSurge: 0
ports:
  websecure:
    port: 8444
    exposedPort: 443
    forwardedHeaders:
      insecure: true
    proxyProtocol:
      insecure: true
  web:
    forwardedHeaders:
      insecure: true
    proxyProtocol:
      insecure: true
hostNetwork: true
nodeSelector:
  ingress: "true"
logs:
  access:
    enabled: true
    format: json
service:
  spec:
    externalTrafficPolicy: Local
